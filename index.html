<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Theme Park Tycoon: Participle World</title>
<style>
:root{--bg:#1d3b5c;--ink:#18304a;--card:#fffaf0;--acc:#f4a21d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10243a}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:6px;flex-wrap:wrap;padding:6px;pointer-events:none}
.pill{background:rgba(255,250,240,.93);color:var(--ink);border-radius:14px;padding:4px 10px;font-weight:700;font-size:14px;box-shadow:0 2px 0 #0003;pointer-events:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 14px;background:var(--acc);color:#2a1a00;font-weight:700;box-shadow:0 3px 0 #0004}
button:disabled{opacity:.45;cursor:default}.sm{padding:3px 9px;font-size:13px}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0006;padding:10px;overflow:auto}
.panel{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;max-width:640px;width:100%;box-shadow:0 8px 0 #0004;max-height:94%;overflow:auto}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:#fff;border:3px solid #cdbfa0;font-size:17px}
.opt.bad{background:#ffd6d6;border-color:#d44}.opt.ok{background:#cdf5cd;border-color:#2a9a2a}
#tc{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
#tc div{pointer-events:auto}#tc button{width:54px;height:54px;font-size:22px;margin:2px;opacity:.8}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.it{background:#fff;border-radius:12px;padding:8px;border:2px solid #e2d6b8}
h2{margin:0 0 6px}.nm{font-weight:800;color:#a24b00}.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;display:none;background:#fffaf0;color:var(--ink);padding:6px 12px;border-radius:12px;font-weight:700}
#hud{gap:6px;padding:8px}#hud>*{pointer-events:auto}.sp{flex:1}
.gp{background:rgba(16,30,50,.62);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:4px 10px;font-size:13px;box-shadow:0 2px 8px #0004;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gp small{opacity:.75;font-size:11px}.gp.w{min-width:112px}.bar{flex:1 0 100%;height:5px;background:#fff3;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#59c9ff;border-radius:3px}
.hb{background:rgba(16,30,50,.62);color:#fff;border:1px solid rgba(255,255,255,.25);padding:5px 11px;box-shadow:0 2px 8px #0004;font-size:14px;backdrop-filter:blur(6px)}
#tc button{width:44px;height:44px;font-size:17px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;border:1px solid rgba(255,255,255,.5);box-shadow:none;opacity:.7;margin:3px}
.tip{background:rgba(255,250,240,.96);border:2px solid #f4a21d;border-radius:16px;padding:7px 14px;box-shadow:0 4px 10px #0004;font-size:15px}
.tip::before{content:"💬 "}.tip::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:#f4a21d;border-bottom:0}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div class="tip" id="tip"></div>
<div id="tc"><div><button id="bu">▲</button><br><button id="bl">◀</button><button id="bd">▼</button><button id="br">▶</button></div><div><button id="be">E</button><br><button id="bz">＋</button><button id="bzo">－</button></div></div>
<div id="ov"><div class="panel" id="pn"></div></div>
<script>
const C=document.getElementById("c"),X=C.getContext("2d"),$=id=>document.getElementById(id);
const CONC=["Continuous form (be + -ing)","-ing adjectives","Perfect form (have + past participle)","-ing as a noun (gerund)","Past participle adjectives","Noun-like “the injured”"];
const HINTS=[["Look for am/is/are/was/were/will be/have been just before the blank.","An action in progress uses be + a verb ending in -ing.","Choose the -ing form of the verb."],
["Ask: is the word describing the thing that causes a feeling?","-ing describes what causes the feeling; -ed describes how a person feels.","The noun is a thing (ride, trick, map…), so pick the -ing adjective."],
["Look at have/has/had before the blank.","Have/has/had is followed by a past participle.","Some past participles are irregular (take→taken, go→gone, ring→rung)."],
["The blank names an activity, like a noun.","A verb used as a noun often ends in -ing (Swimming is fun).","Pick the -ing form that works as the name of an activity."],
["A word is needed to describe a noun, showing what happened to it.","Think: something that has been broken/torn/frozen…","Choose the past participle form (check irregular forms)."],
["“The + describing word” can mean a group of people.","The injured = people who have been injured.","Pick the past participle used with “the”."]];
const EXP=["“{a}” is the -ing form after a form of be. Continuous = be + verb-ing for an action in progress.","“{a}” describes the thing that causes the feeling, so we use -ing. (People who feel it use -ed.)","“{a}” is the past participle needed after have/has/had. Some are irregular, like eaten, taken, gone, written.","“{a}” is an -ing form working as a noun (a gerund): it names an activity.","“{a}” is a past participle used like an adjective to describe the noun.","“the {a}” is a past participle used like a noun for a group of people."];
// loc|npc|stem|correct|w1|w2|w3|custom explanation. Index%6 = concept; level=floor(i/18)
const Q=`Ferris Wheel|Engineer Daniel|The visitors are ___ on the Ferris wheel.|riding|rode|ridden|ride
Roller Coaster Ad|Marketer Mia|Come and enjoy our ___ roller coaster!|exciting|excited|excite|excites
Ticket Booth|Seller Sam|We have ___ all the tickets for today’s magic show.|sold|selling|sell|sells
Water Park|Lifeguard Lena|___ is my favourite activity at the water park.|Swimming|Swam|Swum|Swims
Damaged Bench|Cleaner Omar|We need to replace the ___ bench.|broken|breaking|broke|break
First Aid Centre|Nurse Priya|Some visitors have minor injuries. The nurse is helping the ___.|injured|injures|injure|injuring
Popcorn Stall|Chef Ben|The worker is ___ some popcorn.|making|made|makes|make
Magic Show|Magician Max|The magician is performing an ___ trick.|amazing|amazed|amaze|amazes
Park Cleaning|Cleaner Rosa|The cleaners have ___ the entrance.|cleaned|cleaning|clean|cleans
Dance Plaza|Dancer Kai|The children enjoy ___ to music at the entertainment plaza.|dancing|danced|dances|dance
Food Stall|Chef Lily|A visitor wants chicken already cooked in hot oil. “I would like some ___ chicken, please.”|fried|fry|fries|frying
Shuttle Bus|Driver Hana|A shuttle bus has stopped working. Another bus will collect the ___.|stranded|strand|stranding|strands
Carousel|Operator Joe|The carousel is ___ slowly.|turning|turned|turns|turn
Helping a Family|Mother Aisha|A mother is looking for her upset child. “Can you see the ___ baby near the fountain?”|crying|cried|cries|cry
Ice Cream Stall|Vendor Tom|The customers have ___ all the chocolate ice cream.|eaten|eating|ate|eats
Art Corner|Artist Zoe|___ pictures helps children express their creativity.|Painting|Painted|Paints|Paint
Prize Counter|Clerk Ravi|The employee has finished wrapping the prizes. “The ___ gifts are ready for the winners.”|wrapped|wrapping|wrap|wraps
Special Discounts|Info Officer Lim|The park offers special discounts to the ___ (people who stopped working because of their age).|retired|retiring|retire|retires
Ride Inspection|Engineer Dana|The engineers were ___ the safety equipment when the lights went out.|checking|checked|check|checks
Park Map|Visitor Mr Chen|Many visitors complained about the ___ directions on the map.|confusing|confused|confuse|confuses
Photography Booth|Photographer Eli|Our photographer has ___ more than 200 pictures today.|taken|taking|took|takes
Swimming Lessons|Parent Mrs Tan|My daughter is interested in ___.|swimming|swum|swims|swam
Employee Rest Area|Supervisor Nora|The employees have been working since early morning. “Let the ___ workers take a break.”|exhausted|exhausting|exhaust|exhausts
Safety Drill|Security Guard Raj|In the emergency drill, the rescue team must help those pretending to have injuries. They must help the ___ first.|wounded|wound|wounding|wounds
Night Show|Performer Ivy|At eight o’clock tonight, the performers will be ___ on the main stage.|dancing|danced|dance|dances
Haunted House|Child Ali|The children screamed when they saw the ___ monster decoration.|frightening|frightened|frighten|frightens
Customer Feedback|Secretary Faye|The secretary has ___ an email to the unhappy customer.|written|wrote|writing|writes
Game Booth|Booth Host Leo|___ tokens from different booths is part of the challenge.|Collecting|Collected|Collects|Collect
Ticket Inspection|Gate Guard Ken|A visitor accidentally ripped his ticket. The employee could not scan the ___ ticket.|torn|tearing|tore|tear
Senior Citizens’ Programme|Organiser Gina|Which sentence correctly refers to people who have retired?|We organise activities for the retired.|We organise activities for the retires.|We organise activities for the retiring yesterday.|We organise activities for the retire.|“The retired” is a past participle used like a noun for a group of people.
Bad Weather|Worker Pablo|The maintenance workers are still ___ water from the outdoor stage.|removing|removed|remove|removes
Performance Review|Manager Sue|The performance did not meet the audience’s expectations. It was a ___ performance.|disappointing|disappointed|disappoint|disappoints
Missing Mechanic|Foreman Dev|The mechanic has ___ to the roller coaster to fix a problem.|gone|went|going|goes
Attraction Design|Designer Uma|The designer enjoys ___ new rides for the theme park.|designing|designed|designs|design
Dessert Stall|Chef Marco|The fruit has been kept below freezing overnight. Take the ___ fruit out of the freezer.|frozen|freezing|froze|freeze
Transport Problem|Announcer Beth|The last shuttle has left and several visitors have no transport home. Which announcement is correct?|Please arrange transport for the stranded.|Please arrange transport for the strand.|Please arrange transport for the stranding.|Please arrange transport for the strands.|“The stranded” = people who are stuck. It is a past participle used like a noun.
New Attraction|Engineer Wei|They have been ___ the new roller coaster since nine o’clock.|testing|tested|test|tests
Visitor Experience|Visitor Mrs Lopez|It has been an ___ day, so many visitors are feeling ___.|exhausting; exhausted|exhausted; exhausting|exhausted; exhausted|exhausting; exhausting|The day causes tiredness (exhausting). The visitors feel tired (exhausted).
Park Expansion|Builder Hugo|By the school holidays, the workers will have ___ the new water park.|built|building|build|builds
Game Booth Improvement|Booth Host Pia|We can attract more visitors by ___ a wider variety of games.|introducing|introduced|introduces|introduce
Safety Instructions|Safety Officer Ann|Some visitors do not understand the verbal instructions. Please provide clear ___ instructions at every ride.|written|writing|wrote|writes
Emergency Plan|Nurse Chloe|In an emergency, the first aid team must assist the injured. What does “the injured” refer to?|People who have been injured.|People who cause injuries.|The action of injuring someone.|The equipment used to treat injuries.|“The injured” is a past participle used like a noun: it means people who have been injured.
Incident Investigation|Security Chief Zack|The performers were ___ the audience when a visitor noticed his wallet was missing.|entertaining|entertained|entertain|entertains
Misleading Advertisement|Marketer Olu|An advert says all rides are free, but visitors still pay for some. The manager removes the ___ advertisement.|misleading|misled|mislead|misleads
Opening Problem|Ticket Seller Ria|The ticket booth could not open because an employee left the key at home. She realised she had ___ the key.|forgotten|forgot|forgetting|forgets
Art Corner Review|Teacher Ms Kaur|Painting is the children’s favourite activity. How is “Painting” used here?|As a noun referring to an activity.|As an adjective describing the children.|As part of a continuous verb form.|As a past participle.|Here “Painting” is the subject, naming an activity, so it works as a noun (a gerund).
Visitor Navigation|Guide Tariq|Several visitors have misunderstood the directions and walked to the wrong place. Help the ___ visitors find their way.|confused|confusing|confuse|confuses
Transport Report|Manager Fred|A shuttle bus has broken down, leaving passengers waiting outside. Which sentence refers to them as a group?|The manager has arranged another bus for the stranded.|The manager has arranged another bus for the strand.|The manager has arranged another bus for the strands.|The manager has arranged another bus for the stranding.|“The stranded” = the passengers who are stuck: a past participle used like a noun.
Special Performance|Singer Stella|At this time tomorrow, the famous singer will be ___ in front of thousands of visitors.|performing|performed|performs|perform
Evening Decorations|Lighting Tech Yuki|“The flashing lights make the Ferris wheel look magical.” What is the job of “flashing”?|It acts as an adjective describing the lights.|It acts as a noun naming an activity.|It forms a continuous verb with “are”.|It is part of a perfect verb form.|“Flashing” sits before the noun “lights” and describes them, so it acts as an adjective.
Grand Parade|Parade Leader Cass|The signal bell has ___, so the performers are ready to begin.|rung|rang|ringing|rings
Long Queues|Planner Dina|We can reduce the waiting time by ___ another ticket booth.|opening|opened|opens|open
Storm Damage|Engineer Rob|A storm has damaged several outdoor attractions. Which sentence correctly describes the equipment?|The damaged equipment must be repaired before the park reopens.|The damaging equipment must be repaired before the park reopens.|The damage equipment must be repaired before the park reopens.|The damages equipment must be repaired before the park reopens.|“Damaged” is a past participle used as an adjective: the equipment has been damaged.
Community Programme|Organiser Hope|Which sentence uses a past participle as a noun-like expression for a group of people?|The retired enjoy visiting the park in the morning.|The manager has retired from his position.|The retired employee visited the park yesterday.|The employee retired last year.|“The retired” has no noun after it and means a group of people. In the others, “retired” is a verb or describes “employee”.`.split("\n").map((l,i)=>{const p=l.split("|");return{id:i+1,lv:Math.floor(i/18),cn:i%6,loc:p[0],npc:p[1],stem:p[2],ans:p[3],opts:p.slice(3,7),ex:p[7]}});
const REW=[20,25,30,15,30,20];
const LV=[{n:"Junior Park Manager",coins:100,hap:70,build:2},{n:"Theme Park Supervisor",coins:200,hap:80,build:3},{n:"Theme Park Tycoon",coins:300,hap:90,build:4}];
const SHOP=[["Flower garden",30,4,"#e65a8d"],["Picnic area",40,4,"#c0392b"],["Popcorn stall",60,5,"#e74c3c"],["Ice cream shop",80,6,"#4db6e6"],["Carousel",100,8,"#a05ad6"],["Art corner",120,8,"#2ea86b"]];
const PLOTS=[];for(let r=0;r<2;r++)for(let k=0;k<3;k++)PLOTS.push({x:340+k*560,y:440+r*300,b:null});
const WW=1900,WH=1150;let G,keys={},cam={x:0,y:0,z:1.25},ov=0,place=null,snd=true,last=0,fx=[],shake=0;
const rnd=(a,b)=>a+Math.random()*(b-a),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SK=["#f1c9a0","#d9a066","#8d5a3b","#f6d7b8"],HC=["#2b1b10","#5a3418","#c9a227","#111","#7a2f1a"];
function stations(l){return Q.filter(q=>q.lv==l).map((q,i)=>({q,x:200+i%6*300,y:240+(i/6|0)*300,sol:false,st:{att:0,h:0},sk:SK[i%4],hc:HC[i%5],cl:`hsl(${i*47%360},55%,50%)`}))}
function newGame(l,name){const L=LV[l];G={lv:l,name:name||"My Park",coins:L.coins,stars:0,pass:0,px:WW/2,py:100,dir:2,wt:0,moving:0,sts:stations(l),vis:[],t:0,hist:{},cs:CONC.map(()=>({n:0,ind:0,ok:0})),done:false,keep:false,ft:0};
PLOTS.forEach(p=>p.b=null);for(let i=0;i<10;i++)addVis();deco();}
function addVis(){G.vis.push({x:rnd(80,WW-80),y:[330,630,930][Math.random()*3|0],tx:0,ty:0,sp:rnd(25,45),sk:SK[Math.random()*4|0],hc:HC[Math.random()*5|0],cl:`hsl(${Math.random()*360|0},60%,55%)`,t:Math.random()*9,k:Math.random()<.3,hp:true});}
let TR=[];function deco(){TR=[];let n=0;while(TR.length<46&&n++<900){const x=rnd(30,WW-30),y=rnd(30,WH-20);if(!free(x,y,38))continue;TR.push({x,y,s:rnd(.8,1.3),f:Math.random()<.35})}}
function free(x,y,r){for(const s of G.sts)if(Math.abs(x-s.x)<70+r&&Math.abs(y-s.y)<70+r)return false;for(const p of PLOTS)if(Math.abs(x-p.x)<70+r&&Math.abs(y-p.y)<60+r)return false;for(const y0 of[330,630,930])if(Math.abs(y-y0)<40+r)return false;if(y<150&&Math.abs(x-WW/2)<120)return false;return true}
function happy(){let h=38+G.sts.filter(s=>s.sol).length*2+PLOTS.reduce((a,p)=>a+(p.b&&p.b.done?SHOP[p.b.i][2]:0),0);return Math.min(100,h)}
function builds(){return PLOTS.filter(p=>p.b).length}
function solved(){return G.sts.filter(s=>s.sol).length}
function hud(){const L=LV[G.lv],h=happy();$("hud").innerHTML=`<span class=pill>🏞 ${G.name}</span><span class=pill>🪙 ${G.coins}</span><span class=pill>⭐ ${G.stars}</span><span class=pill>👥 ${G.vis.length}</span><span class=pill>😊 ${h}% (goal ${L.hap}%)</span><span class=pill>✅ ${solved()}/18 · 🏗 ${Math.min(builds(),L.build)}/${L.build}</span><button class=sm onclick=shop()>Shop (B)</button><button class=sm onclick=mapv()>Map (M)</button><button class=sm onclick=jour()>Journal (J)</button><button class=sm onclick="snd=!snd">🔊</button>`}
function open(h){$("pn").innerHTML=h;$("ov").style.display="flex";ov=1}
function close(){$("ov").style.display="none";ov=0;place&&place.pick&&0;hud()}
window.close2=close;
function beep(f,d=.12,t="sine"){if(!snd)return;try{const a=beep.a||(beep.a=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function title(){open(`<h2>🎡 THEME PARK TYCOON: PARTICIPLE WORLD</h2><i>Build your park. Welcome your visitors. Master your grammar.</i><p>“Welcome to your very own theme park! You have a few attractions, a small team of employees and a limited budget. Your mission is to turn this little park into the most exciting theme park in town!”</p>
<p>Park name: <input id=pk value="Sunny Fun Park" maxlength=24 style="font:inherit;padding:4px"></p>
${LV.map((l,i)=>`<button onclick="go(${i})" style="margin:3px">Level ${i+1}: ${l.n}</button>`).join("<br>")}
<p><button class=sm onclick=how()>How to play</button></p>`)}
function how(){open(`<h2>How to play</h2><p>Walk with <b>WASD / arrows</b> (or the on-screen pad). Walk up to a helper with a <b>❗</b> and press <b>E</b>. Answer the grammar question to fix problems and earn 🪙 and ⭐. <b>B</b> shop, <b>M</b> map, <b>J</b> journal. Buy attractions with your coins and click a golden plot to build. Wrong answers are fine: just try again, or press Hint.</p><p><b>Win:</b> finish all 18 encounters, build enough attractions and reach the happiness goal.</p><button onclick=title()>Back</button>`)}
function go(l){newGame(l,$("pk").value.trim());close();cam.z=1.25;}
function near(){let b=null,bd=75;for(const s of G.sts){const d=Math.hypot(G.px-s.x,G.py-(s.y+58));if(d<bd){bd=d;b=s}}return b}
function ask(s){const q=s.q;s.shown=sh(q.opts);s.msg="";s.wrong={};openQ(s)}
function openQ(s,fb){const q=s.q,st=s.st;open(`<div class=nm>🧑 ${q.npc} <small>· ${q.loc}</small></div><p><i>${s.sol?"Thanks, boss!":"“Boss! Can you help me?”"}</i></p><p style="font-size:19px"><b>${q.stem.replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</b></p>
${s.shown.map((o,i)=>`<button class="opt ${s.sol&&o==q.ans?"ok":s.wrong[o]?"bad":""}" ${s.sol?"disabled":""} onclick="pick(${G.sts.indexOf(s)},${i})">${"ABCD"[i]}. ${o}</button>`).join("")}
<p>${fb||""}</p>${s.sol?"":`<button class=sm onclick="hint(${G.sts.indexOf(s)})">💡 Hint</button> `}<button class=sm onclick="close2()">Leave</button>`)}
function expl(q){return q.ex||EXP[q.cn].replace("{a}",q.ans)}
function pick(i,k){const s=G.sts[i],q=s.q,o=s.shown[k];if(s.sol)return;const c=G.cs[q.cn];
if(o==q.ans){if(!s.counted){c.n++;if(!s.st.att&&!s.st.h)c.ind++;c.ok++;s.counted=1}
const stars=!s.st.att&&!s.st.h?3:s.st.att<=1?2:1,coin=REW[q.cn];G.stars+=stars;G.coins+=coin;s.sol=true;s.t0=G.t;beep(660);setTimeout(()=>beep(880),120);
fx.push({x:s.x,y:s.y-60,t:"+"+coin+"🪙"});
openQ(s,`✅ <b>Correct!</b> ${q.stem.replace("___","<b>"+q.ans+"</b>")}<br>${expl(q)}<br><b>+${coin} coins, +${stars} ⭐</b> — look at the park!`);hud();chk()}
else{s.st.att++;s.wrong[o]=1;beep(200,.2,"square");openQ(s,`❌ Not quite. ${hintFor(q,s.st.att)} Try again!`)}}
function hintFor(q,n){return n>1?"Remember: "+HINTS[q.cn][1]:HINTS[q.cn][0]}
function hint(i){const s=G.sts[i];s.st.h=Math.min(3,s.st.h+1);openQ(s,"💡 Hint "+s.st.h+": "+HINTS[s.q.cn][s.st.h-1])}
function chk(){const L=LV[G.lv];if(!G.done&&solved()==18&&builds()>=L.build&&happy()>=L.hap){G.done=true;setTimeout(report,1500)}}
function report(){const n=G.cs.reduce((a,c)=>a+c.ind,0),tot=G.cs.reduce((a,c)=>a+c.ok,0),rows=G.cs.map((c,i)=>{const pct=c.n?Math.round(c.ind/c.n*100):0;return`<tr><td>${CONC[i]}</td><td>${c.ind}/${c.n} first try, no hints</td><td>${c.n&&c.ind==c.n?"✅ Strong":c.ind/c.n>=.5?"🟡 Practise more":"🔴 Revise"}</td></tr>`}).join("");
open(`<h2>🎉 CONGRATULATIONS! YOUR THEME PARK IS A SUCCESS!</h2><p>Coins left: <b>${G.coins}</b> · Attractions built: <b>${builds()}</b> · Visitors: <b>${G.vis.length}</b> · Happiness: <b>${happy()}%</b><br>Questions completed: <b>${solved()}</b> · Independent first-attempt accuracy: <b>${Math.round(n/18*100)}%</b> (${n}/18) · Grammar Stars: <b>${G.stars}</b></p><table style="font-size:14px;width:100%;border-collapse:collapse">${rows}</table><p style="font-size:14px">A concept is “strong” only when every question was right on the first try without hints. Otherwise, revise it.</p>

const CARDS=["Perfect form: have/has/had + past participle. Fun fact: “go” becomes “gone”, never “goed”!","Gerund: “Swimming is fun!” The -ing word is the subject, so it works like a noun.","-ing vs -ed: The ride is exciting. I am excited. What causes the feeling gets -ing.","“The injured”, “the retired”, “the stranded”: past participle + the = a group of people.","Continuous form: be + -ing. “They have been waiting for an hour!”","Irregular past participles: write→written, ring→rung, forget→forgotten, take→taken."];
